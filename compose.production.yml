services:
  db:
    image: postgres:16-alpine
    env_file: ./db.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: ${API_MIGRATE_IMAGE:?API_MIGRATE_IMAGE obrigatoria}
    env_file: ./api.env
    command: npm run db:migrate
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  ml:
    image: ${ML_IMAGE:?ML_IMAGE obrigatoria}
    env_file: ./ml.env
    read_only: true
    tmpfs:
      - /tmp
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: ${API_IMAGE:?API_IMAGE obrigatoria}
    env_file: ./api.env
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      ml:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
